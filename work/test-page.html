<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>成交额图叠加全A分时 - 测试</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f4f7; color: #333842; font-family: system-ui,"PingFang SC",sans-serif; }
    #decoy { display:block; width:min(520px,100%); height:340px; margin:20px auto; background:#eef1f6; }
    #root { width: min(450px,100%); min-height:100vh; margin:auto; padding:28px 14px 60px; background:#fff; }
    .title { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    h1 { margin:0; font-size:20px; }
    .time { color:#989da6; font-size:13px; }
    .tabs { display:flex; justify-content:center; gap:28px; margin-bottom:18px; font-size:14px; }
    .active { font-weight:700; color:#222; }
    .summary { display:grid; grid-template-columns:1fr 1fr; padding:16px 8px; border-radius:12px; background:#f7f8fa; text-align:center; }
    .summary > div + div { border-left:1px solid #dfe2e8; }
    .summary small { color:#747a85; }
    .summary strong { display:block; margin:5px 0; font-size:21px; }
    .up { color:#ef4b43; }
    .legend { display:flex; flex-wrap:wrap; gap:11px 18px; padding:16px 0 8px; color:#6e737d; font-size:12px; }
    .legend-item { display:flex; align-items:center; gap:5px; }
    .line { width:10px; height:2px; border-radius:2px; }
    .blue { background:#428df2; } .orange { background:#f5a12a; } .pink { background:#f45bac; }
    .bars { width:12px; height:8px; background:linear-gradient(90deg,#ef3742 0 48%,transparent 48% 56%,#2fa86d 56%); }
    .chart-frame { position:relative; width:100%; height:300px; }
    #target-chart { display:block; width:100%; height:300px; }
    .hourly { margin-top:12px; padding:14px 8px; border-radius:12px; background:#f7f8fa; }
    .row { display:grid; grid-template-columns:1.25fr repeat(4,1fr); gap:5px; text-align:center; font-size:12px; }
    .row + .row { margin-top:12px; font-size:14px; font-weight:600; }
  </style>
</head>
<body>
  <canvas id="decoy"></canvas>
  <div id="root">
    <div class="title"><h1>成交分析</h1><span class="time">14:50 ⟳</span></div>
    <div class="tabs"><span>沪深京</span><span class="active">沪深</span><span class="active">当日</span><span>近60日</span></div>
    <div class="summary">
      <div><small>沪深两市总成交额</small><strong>1.93万亿元 <span class="up">↑</span></strong><small>较昨日同期放量 <span class="up">0.14万亿</span></small></div>
      <div><small>预测两市总成交额</small><strong>2.02万亿元 <span class="up">↑</span></strong><small>较昨日 <span class="up">+7.25%</span></small></div>
    </div>
    <div class="legend">
      <span class="legend-item"><i class="line blue"></i><span>今日两市成交</span></span>
      <span class="legend-item"><i class="line orange"></i><span>前一日两市成交</span></span>
      <span class="legend-item"><i class="line pink"></i><span>预测两市成交</span></span>
      <span class="legend-item"><i class="bars"></i><span>较前一日增减</span></span>
    </div>
    <div class="chart-frame"><canvas id="target-chart"></canvas></div>
    <div class="hourly">
      <div class="row"><span>每小时统计</span><span>截止10:30</span><span>截止11:30</span><span>截止14:00</span><span>截止15:00</span></div>
      <div class="row"><span>今日</span><span>1.01万亿</span><span>1.37万亿</span><span>1.66万亿</span><span>--</span></div>
      <div class="row"><span>前一日</span><span>9561.31亿</span><span>1.25万亿</span><span>1.51万亿</span><span>1.88万亿</span></div>
    </div>
  </div>
  <script>
    function buildRows(preClose, priceAt) {
      const rows = [];
      for (let index = 0; index < 221; index += 1) {
        const minutes = index <= 120 ? 570 + index : 781 + index - 121;
        const hour = String(Math.floor(minutes / 60)).padStart(2,'0');
        const minute = String(minutes % 60).padStart(2,'0');
        rows.push(`2026-08-24 ${hour}:${minute},${priceAt(index,preClose).toFixed(2)}`);
      }
      return rows;
    }
    const allAPreClose = 6546.12;
    const averagePreClose = 28.20;
    window.__EMA_MARKET_INDEX_MOCKS__ = {
      '47.800004': { data:{ name:'全A', preClose:allAPreClose, trends:buildRows(allAPreClose,(index,preClose)=>preClose+Math.sin(index/19)*18+index*.13-Math.max(0,index-165)*.17) } },
      '47.800005': { data:{ name:'A股平均股价', preClose:averagePreClose, trends:buildRows(averagePreClose,(index,preClose)=>preClose+Math.cos(index/25)*.15-index*.0018+Math.max(0,index-145)*.0008) } },
    };

    const decoy = document.getElementById('decoy');
    const decoyRect = decoy.getBoundingClientRect();
    const decoyDpr = Math.min(devicePixelRatio || 1,2);
    decoy.width = decoyRect.width * decoyDpr;
    decoy.height = decoyRect.height * decoyDpr;
    const canvas = document.getElementById('target-chart');
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1,2);
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr,dpr);
    const width = rect.width;
    const height = rect.height;
    const left = width*.04, right = width*.04, chartTop = height*(20/468), chartBottom = height*((20+324)/468);
    ctx.font = '11px system-ui';
    ctx.fillStyle = '#989da6';
    ctx.textAlign = 'left';
    ['2.02万亿','1.52万亿','1.02万亿','5197亿','160亿'].forEach((label,index)=>{
      const y = chartTop + index/4*(chartBottom-chartTop);
      ctx.strokeStyle='#edf0f4'; ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(width-right,y); ctx.stroke();
      ctx.fillText(label,left+4,y-4);
    });
    ctx.strokeStyle='#f45bac'; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(left,chartTop);ctx.lineTo(width-right,chartTop);ctx.stroke();ctx.setLineDash([]);
    function drawLine(color,offset,scale){ ctx.beginPath(); for(let i=0;i<=240;i++){ const x=left+i/240*(width-left-right); const y=chartBottom-(Math.sqrt(i/240)*scale+offset)*(chartBottom-chartTop); i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke(); }
    drawLine('#428df2',0,.92); drawLine('#f5a12a',0,.84);
    const volumeTop=height*(356/468), volumeBottom=height*(456/468);
    for(let i=0;i<221;i++){const x=left+i/240*(width-left-right);const h=(.25+.65*Math.abs(Math.sin(i/55)))*(volumeBottom-volumeTop);ctx.fillStyle='#ef573f';ctx.fillRect(x,volumeBottom-h,1.4,h);}
    ctx.fillStyle='#9298a3';ctx.textAlign='left';ctx.fillText('9:30',left,volumeTop-5);ctx.textAlign='center';ctx.fillText('11:30/13:00',width/2,volumeTop-5);ctx.textAlign='right';ctx.fillText('15:00',width-right,volumeTop-5);
    if (new URLSearchParams(location.search).has('delay')) {
      const root = document.getElementById('root');
      const savedNodes = [...root.childNodes];
      root.replaceChildren();
      setTimeout(() => root.replaceChildren(...savedNodes), 2000);
    }
    if (new URLSearchParams(location.search).has('delay-canvas')) {
      const frame = document.querySelector('.chart-frame');
      const parent = frame.parentElement;
      const next = frame.nextSibling;
      frame.remove();
      setTimeout(() => parent.insertBefore(frame, next), 2000);
    }
  </script>
  <script src="/outputs/eastmoney-all-a-intraday.user.js"></script>
</body>
</html>
